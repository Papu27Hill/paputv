<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Oculto - El Papu TV</title>

    <!-- Scripts de Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
      // Configuración con tus credenciales de Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyCEKgeSj2UUCq7My6cEKFD8dzDdDG0z_Z8",
        authDomain: "papu-5f7fb.firebaseapp.com",
        databaseURL: "https://papu-5f7fb-default-rtdb.firebaseio.com",
        projectId: "papu-5f7fb",
        storageBucket: "papu-5f7fb.firebasestorage.app",
        messagingSenderId: "385010164384",
        appId: "1:385010164384:web:dd66177923b14e7f9d9fc5",
        measurementId: "G-ME4MKT6QJG"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
    </script>

    <style>
        body {
            background-color: #050505;
            color: #ff1a1a;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            background-image: radial-gradient(circle, #2a0000 0%, #050505 85%);
        }
        .container {
            background: rgba(10, 0, 0, 0.95);
            border: 2px solid #8b0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(139, 0, 0, 0.7);
            padding: 25px;
            border-radius: 8px;
            width: 360px;
            text-align: center;
        }
        .img-banner {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ff0000;
            margin-bottom: 15px;
            box-shadow: 0 0 10px #ff0000;
        }
        input, textarea, select {
            width: 95%;
            padding: 8px;
            margin: 6px 0;
            background: #120000;
            border: 1px solid #ff1a1a;
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-family: monospace;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #ff0000;
            box-shadow: 0 0 8px #ff0000;
        }
        textarea { height: 50px; resize: none; }
        button {
            background: linear-gradient(180deg, #ff1a1a 0%, #660000 100%);
            color: white;
            border: 1px solid #ff0000;
            padding: 10px;
            width: 95%;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
            transition: 0.2s;
        }
        button:hover {
            background: linear-gradient(180deg, #ff3333 0%, #8b0000 100%);
            box-shadow: 0 0 15px #ff0000;
        }
        .hidden { display: none; }
        .lista-wrap {
            width: 95%;
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            font-size: 11px;
            color: #ff8080;
            border: 1px solid #440000;
            border-radius: 4px;
            padding: 8px;
            margin: 12px auto;
            box-sizing: border-box;
        }
        .lista-item {
            border-bottom: 1px solid #330000;
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .acciones-item button {
            width: auto;
            padding: 2px 6px;
            font-size: 10px;
            margin: 0 2px;
            display: inline-block;
        }
        .volver {
            display: inline-block;
            margin-top: 14px;
            color: #ff5555;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }
        .volver:hover { text-decoration: underline; color: #ff8080; }
    </style>
</head>
<body>

    <!-- Login -->
    <div class="container" id="login-box">
        <img src="https://i.pinimg.com/1200x/66/1e/c3/661ec304307861f1bc855f598edc33df.jpg" class="img-banner" alt="Banner">
        <h2>ACCESO</h2>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="validarLogin()">Entrar</button>
    </div>

    <!-- Panel de Contenido -->
    <div class="container hidden" id="panel-box">
        <h2 style="color: #ff3333; margin: 0 0 10px 0;">PANEL AGG</h2>

        <select id="categoria" onchange="toggleCamposSeries()">
            <option value="peliculas">Película</option>
            <option value="series">Serie / Capítulos</option>
            <option value="adultos">+18 (Exclusivo)</option>
        </select>
        
        <input type="text" id="titulo" placeholder="Título (ej: Breaking Bad)">
        
        <div id="camposSerie" class="hidden">
            <input type="text" id="capitulo_info" placeholder="Episodio (ej: T1E01 - Piloto)">
        </div>

        <input type="text" id="imagen_url" placeholder="Imagen URL (portada)">
        <input type="text" id="video_url" placeholder="Link del video (.mp4, etc.)">
        <textarea id="descripcion" placeholder="Descripción / Etiquetas..."></textarea>
        
        <label style="display:flex;align-items:center;gap:6px;color:#ff8080;font-size:11px;width:95%;margin:4px auto;">
            <input type="checkbox" id="censurado" style="width:auto;margin:0;">
            Difuminar portada (+18)
        </label>

        <button onclick="agregarContenido()">Guardar en la Nube</button>

        <h4 style="margin: 15px 0 5px 0; color: #ff5555;">Contenido en Firebase</h4>
        <div class="lista-wrap" id="listaActual">Cargando...</div>

        <a class="volver" onclick="window.history.back(); return false;">&larr; Volver a Papu T:v</a>
    </div>

    <script>
        let catalogoActual = [];

        function validarLogin() {
            let u = document.getElementById("usuario").value;
            let p = document.getElementById("password").value;

            if (u === "Hill" && p === "123") {
                document.getElementById("login-box").classList.add("hidden");
                document.getElementById("panel-box").classList.remove("hidden");
                escucharFirebase();
            } else {
                alert("Acceso denegado.");
            }
        }

        function toggleCamposSeries() {
            const cat = document.getElementById("categoria").value;
            document.getElementById("camposSerie").classList.toggle("hidden", cat !== "series");
        }

        function escucharFirebase() {
            db.ref('catalogo').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                catalogoActual = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                renderLista();
            });
        }

        function agregarContenido() {
            const categoria = document.getElementById("categoria").value;
            let titulo = document.getElementById("titulo").value.trim();
            const capituloInfo = document.getElementById("capitulo_info").value.trim();
            const imgUrl = document.getElementById("imagen_url").value.trim();
            const videoUrl = document.getElementById("video_url").value.trim();
            let descripcion = document.getElementById("descripcion").value.trim();
            const censurado = document.getElementById("censurado").checked;

            if (!titulo || !videoUrl) {
                alert("Ingresa al menos Título y Link del video.");
                return;
            }

            if (categoria === "series" && capituloInfo) {
                descripcion = capituloInfo + (descripcion ? " | " + descripcion : "");
            }

            const nuevoId = Date.now().toString();
            const item = {
                categoria: categoria,
                titulo: titulo,
                imagen: imgUrl,
                video: videoUrl,
                descripcion: descripcion,
                censurado: censurado,
                fecha: new Date().toLocaleString()
            };

            db.ref('catalogo/' + nuevoId).set(item, (err) => {
                if (err) {
                    alert("Error al subir contenido.");
                } else {
                    document.getElementById("titulo").value = "";
                    document.getElementById("capitulo_info").value = "";
                    document.getElementById("imagen_url").value = "";
                    document.getElementById("video_url").value = "";
                    document.getElementById("descripcion").value = "";
                    document.getElementById("censurado").checked = false;
                    alert("¡Agregado exitosamente a Firebase!");
                }
            });
        }

        function reemplazarLink(id, linkActual) {
            const nuevoLink = prompt("Nuevo link del video:", linkActual);
            if (nuevoLink && nuevoLink.trim() !== "") {
                db.ref('catalogo/' + id + '/video').set(nuevoLink.trim());
            }
        }

        function eliminarItem(id) {
            if (confirm("¿Deseas eliminar este elemento?")) {
                db.ref('catalogo/' + id).remove();
            }
        }

        function renderLista() {
            const wrap = document.getElementById("listaActual");
            if (catalogoActual.length === 0) {
                wrap.innerHTML = "<em>No hay elementos subidos aún.</em>";
                return;
            }

            wrap.innerHTML = catalogoActual
                .slice()
                .reverse()
                .map(it => `
                    <div class="lista-item">
                        <div>
                            <strong>[${it.categoria}]</strong> ${it.titulo}
                        </div>
                        <div class="acciones-item">
                            <button onclick="reemplazarLink('${it.id}', '${it.video}')" title="Editar link">✏️ Link</button>
                            <button onclick="eliminarItem('${it.id}')" style="background:#8b0000;" title="Eliminar">🗑️</button>
                        </div>
                    </div>
                `)
                .join("");
        }
    </script>
</body>
</html>
