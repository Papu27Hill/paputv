<style>
  :root{
    --bg: #09070f;
    --panel: #110d1c;
    --panel-2: #191328;
    --purple: #9d4edd;
    --purple-light: #c77dff;
    --purple-glow: rgba(157, 78, 221, 0.4);
    --text: #f3f0f8;
    --muted: #8d859e;
    --line: #221a36;
    --danger: #ff4d6d;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, #1c1333 0%, #09070f 70%);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  body{
    display: grid;
    grid-template-columns: 240px 1fr;
  }

  aside{
    background: linear-gradient(180deg, var(--panel) 0%, #0c0914 100%);
    border-right: 1px solid var(--line);
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--text);
    padding: 0 20px 24px 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }

  .brand img{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--purple);
  }

  .brand span{ color: var(--purple-light); }

  nav{ display: flex; flex-direction: column; }

  .cat-btn{
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .3px;
    border-left: 3px solid transparent;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }

  .cat-btn .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background .2s ease;
    flex-shrink: 0;
  }

  .cat-btn:hover, .cat-btn:focus{ color: var(--text); background: var(--panel-2); }

  .cat-btn.active{
    color: var(--text);
    background: linear-gradient(90deg, var(--panel-2) 0%, transparent 100%);
    border-left-color: var(--purple-light);
  }
  .cat-btn.active .dot{ background: var(--purple-light); box-shadow: 0 0 8px var(--purple-light); }

  .cat-btn.nsfw-btn{ color: var(--danger); }
  .cat-btn.nsfw-btn.active{ border-left-color: var(--danger); }
  .cat-btn.nsfw-btn .dot{ background: var(--danger); }

  .cat-btn:focus,
  .card:focus,
  .close-btn:focus,
  .btn-flotante-papu:focus,
  .btn-flotante-sugerencias:focus,
  .search-box:focus {
    outline: 3px solid var(--purple-light) !important;
    outline-offset: -2px;
    background: var(--panel-2);
    box-shadow: 0 0 15px var(--purple-glow);
  }

  main{ padding: 40px 48px 80px; }

  header.top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    gap: 15px;
    flex-wrap: wrap;
  }

  header.top h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffffff, var(--purple-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header.top .count{
    color: var(--muted);
    font-size: 13px;
  }

  .search-box {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 20px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    width: 250px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  section.row{ margin-bottom: 48px; }

  .row-title{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .row-title::after{
    content:'';
    flex:1;
    height:1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
  }

  .card{
    all: unset;
    cursor: pointer;
    background: linear-gradient(145deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }

  .card:hover, .card:focus{
    transform: translateY(-4px);
    border-color: var(--purple);
  }

  .thumb{
    aspect-ratio: 2/3;
    background: linear-gradient(160deg, #261b3d, #110c1c);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--line);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }

  .thumb img.cover-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: filter .3s ease, transform .3s ease;
  }

  .thumb.censored img.cover-img{
    filter: blur(25px) brightness(0.4);
    transform: scale(1.2);
  }

  .card:hover .thumb.censored img.cover-img,
  .card:focus .thumb.censored img.cover-img{
    filter: blur(0px) brightness(1);
    transform: scale(1);
  }

  .thumb .play{
    position: absolute;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(15, 10, 25, 0.7);
    border: 1px solid var(--purple-light);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity .2s ease;
    box-shadow: 0 0 10px var(--purple-glow);
    z-index: 2;
  }
  .card:hover .play, .card:focus .play{ opacity: 1; }
  .play::before{
    content:'';
    border-left: 10px solid var(--purple-light);
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    margin-left: 3px;
  }

  .meta{ padding: 10px 12px 14px; position: relative; z-index: 2; }
  .meta .title{ font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .meta .tag{ font-size: 11px; color: var(--muted); }

  .btn-flotante-papu {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 60px;
    height: 60px;
    background: #000;
    border: 2px solid #ff0000;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.7), inset 0 0 10px rgba(255, 0, 0, 0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-flotante-papu img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .btn-flotante-papu:hover, .btn-flotante-papu:focus {
    transform: scale(1.1);
    box-shadow: 0 0 30px #ff0000, inset 0 0 15px #ff0000;
    outline: none;
  }

  .btn-flotante-sugerencias {
    position: fixed;
    bottom: 95px;
    right: 25px;
    width: 60px;
    height: 60px;
    background: #000;
    border: 2px solid var(--purple-light);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--purple-glow), inset 0 0 10px var(--purple-glow);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-flotante-sugerencias img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .btn-flotante-sugerencias:hover, .btn-flotante-sugerencias:focus {
    transform: scale(1.1);
    box-shadow: 0 0 30px var(--purple-light), inset 0 0 15px var(--purple-light);
    outline: none;
  }

  .modal-bg{
    display: none;
    position: fixed; inset: 0;
    background: rgba(5, 3, 9, 0.9);
    backdrop-filter: blur(8px);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .modal-bg.open{ display: flex; }

  .modal{
    background: linear-gradient(180deg, var(--panel) 0%, #0a0712 100%);
    border: 1px solid var(--purple);
    border-radius: 12px;
    width: min(900px, 100%);
    overflow: hidden;
    box-shadow: 0 0 30px rgba(157, 78, 221, 0.2);
  }

  .modal video{ width: 100%; display: block; background: #000; }

  .modal-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
  }
  .modal-head h3{ font-size: 15px; font-weight: 600; }
  .close-btn{
    all: unset;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    transition: border-color .2s ease, color .2s ease;
  }
  .close-btn:hover, .close-btn:focus{ color: var(--text); border-color: var(--purple-light); outline: none; }

  @media (max-width: 720px){
    body{ grid-template-columns: 1fr; }
    aside{ position: relative; height: auto; flex-direction: row; overflow-x: auto; padding: 16px 0; border-right: none; border-bottom: 1px solid var(--line); }
    .brand{ display: none; }
    nav{ flex-direction: row; gap: 8px; padding: 0 16px; }
    .cat-btn{ padding: 10px 16px; border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .cat-btn.active{ border-left-color: transparent; border-bottom-color: var(--purple-light); background: linear-gradient(0deg, var(--panel-2) 0%, transparent 100%); }
    .cat-btn.nsfw-btn.active{ border-bottom-color: var(--danger); }
    main{ padding: 24px 16px 100px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .search-box { width: 100%; }
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <img src="icon.png" alt="Papu T:v Icon">
    <div>PAPU <span>T:v</span></div>
  </div>
  <nav id="catNav"></nav>
</aside>

<main>
  <header class="top">
    <div>
      <h1 id="pageTitle">Inicio</h1>
      <span class="count" id="pageCount"></span>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por nombre..." oninput="filtrarBusqueda()" tabindex="0">
  </header>
  <div id="rows"></div>
</main>

<a href="mailto:" class="btn-flotante-sugerencias" title="Pedir contenido" tabindex="0" onclick="alert('Envía solicitudes de películas para aportar el contenido que quieres.');">
    <img src="https://i.pinimg.com/originals/4d/69/ac/4d69acc3793c1fd49b1cec20eddd9408.gif" alt="Sugerencias">
</a>

<a href="panel.html" class="btn-flotante-papu" title="Panel Oculto" tabindex="0">
    <img src="https://i.pinimg.com/736x/96/5f/c1/965fc198184680345b68fda7c2766ea2.jpg" alt="Panel Oculto">
</a>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <video id="player" controls tabindex="0"></video>
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="close-btn" id="closeBtn" tabindex="0">Cerrar</button>
    </div>
  </div>
</div>

<script>
  let audioCtx = null;

  function playClickSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    } catch (e) {}
  }

  const CATEGORIAS_BASE = {
    peliculas: { label: "Películas", items: [] },
    series: { label: "Series", items: [] },
    adultos: { label: "+18 (Exclusivo)", items: [] }
  };

  let DATA = JSON.parse(JSON.stringify(CATEGORIAS_BASE));
  let filtroBusqueda = "";
  let activeCat = 'all';

  const catNav = document.getElementById('catNav');
  const rows = document.getElementById('rows');
  const pageTitle = document.getElementById('pageTitle');
  const pageCount = document.getElementById('pageCount');

  // Lectura en tiempo real desde Firebase DB
  db.ref('catalogo').on('value', (snapshot) => {
    const rawData = snapshot.val() || {};
    const guardados = Object.values(rawData);
    const dataFinal = JSON.parse(JSON.stringify(CATEGORIAS_BASE));

    guardados.forEach(it => {
      if (!it) return;
      const cat = dataFinal[it.categoria] ? it.categoria : "peliculas";
      dataFinal[cat].items.push({
        title: it.titulo,
        tag: it.descripcion || "",
        src: it.video,
        poster: it.imagen || "",
        censored: !!it.censurado
      });
    });

    DATA = dataFinal;
    render();
  });

  function totalItems(){
    return Object.keys(DATA).reduce((n,k) => n + DATA[k].items.length, 0);
  }

  function renderNav(){
    catNav.innerHTML = '';
    catNav.appendChild(makeCatBtn('all', 'Inicio'));
    Object.keys(DATA).forEach(k => catNav.appendChild(makeCatBtn(k, DATA[k].label)));
  }

  function makeCatBtn(key, label){
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (activeCat === key ? ' active' : '') + (key === 'adultos' ? ' nsfw-btn' : '');
    btn.innerHTML = `<span class="dot"></span>${label}`;
    btn.setAttribute('tabindex', '0');
    btn.addEventListener('click', () => { 
      playClickSound();
      activeCat = key; 
      render(); 
    });
    return btn;
  }

  function filtrarBusqueda() {
    filtroBusqueda = document.getElementById('searchInput').value.toLowerCase().trim();
    renderRows();
  }

  function renderRows(){
    rows.innerHTML = '';
    const keys = Object.keys(DATA);
    const catsToShow = activeCat === 'all' ? keys : [activeCat];
    let encontradosTotal = 0;

    catsToShow.forEach(k => {
      const itemsFiltrados = DATA[k].items.filter(item => 
        item.title.toLowerCase().includes(filtroBusqueda) || 
        item.tag.toLowerCase().includes(filtroBusqueda)
      );

      encontradosTotal += itemsFiltrados.length;
      if (itemsFiltrados.length === 0) return;

      const section = document.createElement('section');
      section.className = 'row';

      const title = document.createElement('div');
      title.className = 'row-title';
      title.textContent = DATA[k].label;
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'grid';

      itemsFiltrados.forEach(item => {
        const card = document.createElement('button');
        card.className = 'card';
        card.setAttribute('tabindex', '0');
        
        const thumbContent = item.poster 
          ? `<img class="cover-img" src="${item.poster}" alt="${item.title}">`
          : `<div style="padding: 20px; text-align: center; font-weight: bold;">${item.title}</div>`;

        card.innerHTML = `
          <div class="thumb ${item.censored ? 'censored' : ''}">
            ${thumbContent}
            <div class="play"></div>
          </div>
          <div class="meta">
            <div class="title">${item.title}</div>
            <div class="tag">${item.tag}</div>
          </div>
        `;
        card.addEventListener('click', () => {
          playClickSound();
          openPlayer(item);
        });
        grid.appendChild(card);
      });

      section.appendChild(grid);
      rows.appendChild(section);
    });

    if (encontradosTotal === 0) {
      rows.innerHTML = `
        <div style="color: var(--muted); padding: 40px 0; text-align: center;">
          No se encontraron títulos.
        </div>`;
    }
  }

  function render(){
    renderNav();
    renderRows();
    pageTitle.textContent = activeCat === 'all' ? 'Inicio' : DATA[activeCat].label;
    const n = activeCat === 'all' ? totalItems() : DATA[activeCat].items.length;
    pageCount.textContent = n + (n === 1 ? ' título' : ' títulos');
  }

  const modalBg = document.getElementById('modalBg');
  const player = document.getElementById('player');
  const modalTitle = document.getElementById('modalTitle');
  const closeBtn = document.getElementById('closeBtn');

  function openPlayer(item){
    modalTitle.textContent = item.title;
    player.src = item.src || '';
    modalBg.classList.add('open');
    if(item.src) player.play().catch(()=>{});
    closeBtn.focus();
  }

  function closePlayer(){
    playClickSound();
    player.pause();
    player.src = '';
    modalBg.classList.remove('open');
  }

  closeBtn.addEventListener('click', closePlayer);
  modalBg.addEventListener('click', (e) => { if(e.target === modalBg) closePlayer(); });

  // Sistema de navegación espacial con las flechitas del teclado / D-Pad
  document.addEventListener('keydown', (e) => {
    const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

    if (e.key === 'Escape' && modalBg.classList.contains('open')) {
      closePlayer();
      return;
    }

    if (!arrowKeys.includes(e.key)) return;

    // Si estás escribiendo en la barra de búsqueda, se permite mover el cursor del texto
    if (document.activeElement === document.getElementById('searchInput') && e.key !== 'ArrowDown') {
      return;
    }

    e.preventDefault();

    const isModalOpen = modalBg.classList.contains('open');
    const container = isModalOpen ? modalBg : document;
    const focusables = Array.from(container.querySelectorAll('button:not([disabled]), input, a[href], video, [tabindex="0"]'))
      .filter(el => el.offsetParent !== null && window.getComputedStyle(el).display !== 'none' && window.getComputedStyle(el).visibility !== 'hidden');

    if (!focusables.length) return;

    const current = document.activeElement;
    if (!focusables.includes(current)) {
      focusables[0].focus();
      return;
    }

    const cRect = current.getBoundingClientRect();
    let bestMatch = null;
    let minDist = Infinity;

    focusables.forEach(el => {
      if (el === current) return;
      const r = el.getBoundingClientRect();
      let isCandidate = false;

      if (e.key === 'ArrowRight' && r.left >= cRect.right - 10) isCandidate = true;
      if (e.key === 'ArrowLeft' && r.right <= cRect.left + 10) isCandidate = true;
      if (e.key === 'ArrowDown' && r.top >= cRect.bottom - 10) isCandidate = true;
      if (e.key === 'ArrowUp' && r.bottom <= cRect.top + 10) isCandidate = true;

      if (isCandidate) {
        const dx = (r.left + r.width / 2) - (cRect.left + cRect.width / 2);
        const dy = (r.top + r.height / 2) - (cRect.top + cRect.height / 2);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < minDist) {
          minDist = dist;
          bestMatch = el;
        }
      }
    });

    if (bestMatch) {
      bestMatch.focus();
    }
  });
</script>
